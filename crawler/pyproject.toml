[project]
name = "crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Costa", email = "costantinocavallo@gmail.com" }
]
requires-python = ">=3.13, <4"
dependencies = [
    "crawl4ai>=0.6.3",
    "fastapi>=0.115.12",
    "markdownify>=1.1.0",
    "playwright>=1.52.0",
    "pydantic>=2.11.5",
    "starlette>=0.46.2",
    "uvicorn>=0.34.2",
]

[project.scripts]
crawler = "crawler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
