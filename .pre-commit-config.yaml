repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks: [{id: black}]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks: [{id: isort}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks: [{id: ruff}]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks: [{id: commitizen}]
